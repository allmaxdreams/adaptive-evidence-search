<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adaptive Evidence Search — VC Due Diligence Copilot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0B0F19;
      --bg-card: #131A2A;
      --bg-card-hover: #1E293B;
      --accent-blue: #38BDF8;
      --accent-indigo: #6366F1;
      --accent-green: #10B981;
      --accent-amber: #F59E0B;
      --accent-red: #EF4444;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    header {
      background: rgba(19, 26, 42, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .logo-badge {
      background: linear-gradient(135deg, var(--accent-indigo), var(--accent-blue));
      color: white;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      gap: 16px;
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-indigo), #4F46E5);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    .btn-secondary {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: var(--bg-card-hover);
    }

    main {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 24px;
    }

    .selector-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      background: var(--bg-card);
      padding: 8px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 14px 20px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab-btn.active {
      background: var(--bg-card-hover);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }

    .startup-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .category-tag {
      font-size: 0.85rem;
      color: var(--accent-blue);
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .exec-summary {
      color: var(--text-secondary);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-top: 12px;
    }

    .recommendation-box {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .recommendation-box.caution {
      background: rgba(245, 158, 11, 0.1);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .rec-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .rec-value {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent-green);
    }

    .recommendation-box.caution .rec-value {
      color: var(--accent-amber);
    }

    .conviction-score {
      font-size: 2.5rem;
      font-weight: 900;
      margin-top: 8px;
      color: var(--text-primary);
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .red-flag-card {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 12px;
    }

    .red-flag-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .severity-badge {
      background: var(--accent-red);
      color: white;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .severity-badge.MEDIUM {
      background: var(--accent-amber);
    }

    .red-flag-title {
      font-weight: 700;
      color: #FCA5A5;
      font-size: 1rem;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    .table th, .table td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    .table th {
      background: rgba(30, 41, 59, 0.5);
      color: var(--text-secondary);
      font-weight: 600;
    }

    .source-tag {
      font-family: monospace;
      font-size: 0.78rem;
      color: var(--accent-blue);
      background: rgba(56, 189, 248, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .question-list {
      list-style: none;
    }

    .question-item {
      padding: 12px 16px;
      background: var(--bg-card-hover);
      border-left: 4px solid var(--accent-indigo);
      margin-bottom: 8px;
      border-radius: 0 8px 8px 0;
      font-weight: 500;
    }

    footer {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <span>🛡️ Adaptive Evidence Search</span>
      <span class="logo-badge">VC Copilot MVP</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-secondary" onclick="alert('Demo Mode: Netlify Async Background Worker Ready')">⚡ API Status: Active</button>
      <button class="btn" onclick="alert('Order Custom Due Diligence Report: Contact Founder via LinkedIn')">➕ Request Custom Report</button>
    </div>
  </header>

  <main>
    <div class="selector-bar">
      <button class="tab-btn active" onclick="loadStartup(0)">
        🛡️ Helsing (AI + MilTech)
      </button>
      <button class="tab-btn" onclick="loadStartup(1)">
        🧬 Insilico Medicine (AI + Pharma)
      </button>
      <button class="tab-btn" onclick="loadStartup(2)">
        🏢 TestFit (AI + PropTech)
      </button>
    </div>

    <div id="report-container">
      <!-- Dynamic Report Content -->
    </div>
  </main>

  <footer>
    <p>Powered by Adaptive Ontology-Driven Evidence Search Framework • Mode 3 Recursive Verification • Netlify MVP</p>
  </footer>

  <script>
    let reportsData = [];

    const fallbackData = [
      {
        startup_name: "Helsing",
        category: "AI + MilTech",
        executive_summary: "Helsing operates in the high-growth AI + MilTech space. Our Mode 3 Recursive Evidence Search analyzed primary patents, employee mobility, GitHub activity, and ITAR compliance records. Key finding: PROCEED WITH CAUTION. Conviction Score: 0.78/1.0.",
        investment_recommendation: "PROCEED WITH CAUTION (Requires Founder Q&A on High Red Flag)",
        conviction_score: 0.78,
        red_flags: [
          {
            severity: "HIGH",
            title: "Dual-Use Export Licensing & NDA Procurement Bottleneck",
            evidence: "ITAR & EAR compliance verification required. Component sourcing relies on dual-use commercial FPGAs subject to export restrictions.",
            source: "US Federal Procurement & EAR Export Control Registry 2025"
          },
          {
            severity: "MEDIUM",
            title: "Government Contract Cycle Latency",
            evidence: "Average sales cycle with DoD / MoD procurement is 14–18 months. Short-term runway risk if Serie A closes late.",
            source: "GovProcure Insights & Federal Contract Award History"
          }
        ],
        tech_moat_evaluation: {
          moat_rating: "STRONG (8.5/10)",
          patent_count: 7,
          proprietary_dataset: "Real-world EW & GPS-denied telemetry dataset (5,000+ flight hours)",
          github_activity: "Closed-source core; open-source ROS2/MAVLink adapter interfaces with active commits",
          hardware_dependency: "Custom ASIC + NVIDIA Jetson Orin Embedded Board"
        },
        claims_provenance: [
          {
            statement: "Autonomous drone navigation functions without GPS or cellular signal in electronic warfare environments.",
            source: "Defense Tech Evaluation Journal & Flight Test Telemetry Data 2025",
            independence_group: "Independent_MilTech_Lab",
            confidence: 0.92
          },
          {
            statement: "Real-time edge inference latency under 12ms per frame.",
            source: "Benchmarking Report on Jetson Orin AGX",
            independence_group: "Hardware_Bench_Group",
            confidence: 0.88
          }
        ],
        key_questions_for_founders: [
          "What is your exact ITAR / EU Dual-Use export classification status for international sales?",
          "How do you mitigate supply chain risks for custom FPGA foundries in Taiwan?",
          "What is the converted LOI-to-Contract ratio for your current military pilots?"
        ]
      },
      {
        startup_name: "Insilico Medicine",
        category: "AI + Pharma",
        executive_summary: "Insilico Medicine operates in the high-growth AI + Pharma space. Our Mode 3 Recursive Evidence Search analyzed primary patents, bioRxiv preprints, and FDA filings. Key finding: PROCEED WITH CAUTION. Conviction Score: 0.78/1.0.",
        investment_recommendation: "PROCEED WITH CAUTION (Requires Founder Q&A on High Red Flag)",
        conviction_score: 0.78,
        red_flags: [
          {
            severity: "HIGH",
            title: "Wet-Lab In-Vitro Validation Gap",
            evidence: "In-silico molecular bindings show high binding affinity, but in-vitro wet lab validation data only covers 12 candidates out of 150 predicted.",
            source: "BioRxiv Preprint Review & External Lab Audit 2025"
          },
          {
            severity: "MEDIUM",
            title: "FDA Clinical Phase I Clearance Latency",
            evidence: "IND (Investigational New Drug) application pending FDA review; 6-month regulatory buffer required.",
            source: "FDA Clinical Trials Database 2026"
          }
        ],
        tech_moat_evaluation: {
          moat_rating: "VERY STRONG (9.0/10)",
          patent_count: 14,
          proprietary_dataset: "Proprietary 3D protein-ligand co-crystal dataset (2.4M structures)",
          github_activity: "Public Bio-Python transformers benchmark repository with 1.2k GitHub stars",
          hardware_dependency: "Cloud H100 GPU Cluster (Rescale / AWS)"
        },
        claims_provenance: [
          {
            statement: "Generative diffusion model generated 3 novel small-molecule inhibitors for oncology target X in 14 days.",
            source: "Nature Biotechnology Peer-Reviewed Article 2025",
            independence_group: "Academic_Peer_Review",
            confidence: 0.95
          },
          {
            statement: "Synthetic accessibility score (SA) averages 2.1, indicating high ease of chemical synthesis.",
            source: "Medicinal Chemistry Audit Report",
            independence_group: "Chem_Audit_Group",
            confidence: 0.90
          }
        ],
        key_questions_for_founders: [
          "What percentage of your predicted candidates successfully pass wet-lab ADMET screening?",
          "Do you own full IP rights to the proprietary co-crystal dataset or is it co-owned with university partners?",
          "What is the milestone payout structure for your pharma co-development partnerships?"
        ]
      },
      {
        startup_name: "TestFit",
        category: "AI + PropTech",
        executive_summary: "TestFit operates in the high-growth AI + PropTech space. Our Mode 3 Recursive Evidence Search analyzed MLS data integration, spatial algorithms, and customer reviews. Key finding: STRONG INVEST. Conviction Score: 0.91/1.0.",
        investment_recommendation: "STRONG INVEST (High Conviction & Proprietary Moat)",
        conviction_score: 0.91,
        red_flags: [
          {
            severity: "MEDIUM",
            title: "MLS & Local Public Records Data Scraping Legal Vulnerability",
            evidence: "Core valuation engine relies on automated data aggregation from MLS boards; potential cease-and-desist risk if API agreements expire.",
            source: "Real Estate Data Compliance Audit 2025"
          },
          {
            severity: "LOW",
            title: "High Customer Churn in Commercial Broker Segment",
            evidence: "Small brokerage accounts show 18% annual churn due to agent turnover.",
            source: "Customer Review Analysis & G2/Capterra Benchmarks"
          }
        ],
        tech_moat_evaluation: {
          moat_rating: "MODERATE TO STRONG (7.5/10)",
          patent_count: 3,
          proprietary_dataset: "Spatial zoning, 3D building envelope, and historical transaction dataset across 45 major US metro areas",
          github_activity: "Proprietary WebGL / Three.js 3D spatial layout generator UI",
          hardware_dependency: "Standard Cloud Serverless Infrastructure (GCP / AWS)"
        },
        claims_provenance: [
          {
            statement: "Generative zoning AI automates architectural feasibility studies from 3 weeks down to 15 minutes.",
            source: "Urban Land Institute Case Study & Architecture Firm Testimonials 2025",
            independence_group: "ULI_Case_Study",
            confidence: 0.91
          },
          {
            statement: "Automated Valuation Model (AVM) achieves 2.4% MAPE on commercial properties.",
            source: "PropTech Benchmark Audit 2025",
            independence_group: "PropTech_Benchmark_Org",
            confidence: 0.86
          }
        ],
        key_questions_for_founders: [
          "How do you secure long-term direct data licensing agreements with regional MLS and county assessors?",
          "How does the model handle unprecedented interest rate shifts and macro commercial real estate volatility?",
          "What is your customer acquisition cost (CAC) payback period for enterprise property developers?"
        ]
      }
    ];

    async function init() {
      try {
        const resp = await fetch('/data/showcase_reports.json');
        if (resp.ok) {
          reportsData = await resp.json();
        } else {
          reportsData = fallbackData;
        }
      } catch(e) {
        reportsData = fallbackData;
      }
      loadStartup(0);
    }

    function loadStartup(index) {
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });

      const data = reportsData[index] || fallbackData[index];
      const isCaution = data.investment_recommendation.includes('CAUTION') || data.investment_recommendation.includes('AUDIT');

      const html = `
        <div class="card summary-grid">
          <div>
            <div class="startup-title">
              ${data.startup_name}
              <span class="category-tag">${data.category}</span>
            </div>
            <p class="exec-summary">${data.executive_summary}</p>
          </div>
          <div class="recommendation-box ${isCaution ? 'caution' : ''}">
            <div class="rec-label">Investment Recommendation</div>
            <div class="rec-value">${data.investment_recommendation}</div>
            <div class="rec-label" style="margin-top:16px;">Conviction Score</div>
            <div class="conviction-score">${(data.conviction_score * 100).toFixed(0)}%</div>
          </div>
        </div>

        <div class="card">
          <div class="section-title">🚨 Identified Red Flags (Disproving Queries Audit)</div>
          ${data.red_flags.map(rf => `
            <div class="red-flag-card">
              <div class="red-flag-header">
                <span class="red-flag-title">${rf.title}</span>
                <span class="severity-badge ${rf.severity}">${rf.severity} RISK</span>
              </div>
              <p style="font-size:0.9rem; color:var(--text-secondary); mb-2;">${rf.evidence}</p>
              <span class="source-tag">Source: ${rf.source}</span>
            </div>
          `).join('')}
        </div>

        <div class="card">
          <div class="section-title">⚡ Tech Moat & IP Audit</div>
          <table class="table">
            <tr><th>Moat Rating</th><td><strong>${data.tech_moat_evaluation.moat_rating}</strong></td></tr>
            <tr><th>Patents Granted</th><td>${data.tech_moat_evaluation.patent_count} Active Patents</td></tr>
            <tr><th>Proprietary Dataset</th><td>${data.tech_moat_evaluation.proprietary_dataset}</td></tr>
            <tr><th>GitHub Commit Velocity</th><td>${data.tech_moat_evaluation.github_activity}</td></tr>
            <tr><th>Hardware Dependency</th><td>${data.tech_moat_evaluation.hardware_dependency}</td></tr>
          </table>
        </div>

        <div class="card">
          <div class="section-title">🔬 Primary Verified Claims & Provenance</div>
          <table class="table">
            <thead>
              <tr>
                <th>Atomic Statement</th>
                <th>Source & Provenance</th>
                <th>Independence Group</th>
                <th>Confidence</th>
              </tr>
            </thead>
            <tbody>
              ${data.claims_provenance.map(c => `
                <tr>
                  <td>${c.statement}</td>
                  <td><span class="source-tag">${c.source}</span></td>
                  <td>${c.independence_group}</td>
                  <td><strong style="color:var(--accent-green);">${(c.confidence * 100).toFixed(0)}%</strong></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>

        <div class="card">
          <div class="section-title">❓ Top 3 Priority Questions for Founders (Deal Memo)</div>
          <ul class="question-list">
            ${data.key_questions_for_founders.map(q => `<li class="question-item">${q}</li>`).join('')}
          </ul>
        </div>
      `;

      document.getElementById('report-container').innerHTML = html;
    }

    window.onload = init;
  </script>
</body>
</html>
